name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q "$(find . -name '*.zip' | head -n 1)"
      - run: sed -i 's/work-runtime-ktx:2.9.3/work-runtime-ktx:2.9.1/' MeteoMinimal/app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug
        working-directory: MeteoMinimal
      - uses: actions/upload-artifact@v4
        with:
          name: meteo-apk
          path: MeteoMinimal/app/build/outputs/apk/debug/app-debug.apk
